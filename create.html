<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Caleta | Pizzería Secreta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style/styles.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
    <section id="topbar" class="py-2">
        <div class="container d-flex justify-content-between align-items-center">
            <!-- Contactos (En móvil se oculta el correo para que no sature) -->
            <div class="d-flex align-items-center gap-3">
                <a href="tel:+51999999999" class="text-nowrap"><i class="fa-solid fa-phone me-1"></i> (+51) 999 999
                    999</a>
                <a href="mailto:lacaleta@gmail.com" class="d-none d-sm-inline text-nowrap"><i
                        class="fa-regular fa-envelope me-1"></i> lacaleta@gmail.com</a>
            </div>
            <!-- Redes Sociales -->
            <div class="d-flex align-items-center gap-3">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-tiktok"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </div>
    </section>

    <!-- Encabezado / Navegación Responsive -->
    <header id="header" class="navbar navbar-expand-lg py-2">
        <div class="container">
            <!-- Logo -->
            <a class="navbar-brand me-3" href="index.html" style="width: 130px;">
                <img src="images/lacaleta.png" class="img-fluid" alt="Logo La Caleta">
            </a>
            <!-- Frase (Visible solo en pantallas grandes) -->
            <div class="d-none d-xl-block text-secondary fst-italic small">
                "El que come callado, come doble"
            </div>
            <!-- Botón Hamburguesa (Aparece en tablets y móviles) -->
            <button class="navbar-toggler border-0 text-white shadow-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuNavegacion" aria-controls="menuNavegacion" aria-expanded="false"
                aria-label="Abrir menú">
                <i class="fa-solid fa-bars fs-3 text-white"></i>
            </button>
            <!-- Enlaces colapsables -->
            <div class="collapse navbar-collapse justify-content-end" id="menuNavegacion">
                <nav
                    class="d-flex flex-column flex-lg-row align-items-end align-items-lg-center gap-3 gap-lg-2 p-3 p-lg-0 my-2 my-lg-0">
                    <a id="navLinkMenu" class="nav-link px-3 py-1 fw-bold rounded-pill border nav-menu-link-active text-nowrap"
                        href="index.html">Menú</a>
                    <a class="nav-link px-3 py-1 fw-bold text-white text-nowrap" href="#">Promociones</a>
                    <a class="nav-link px-3 py-1 fw-bold text-white text-nowrap" href="#">Locales</a>
                    <!-- Carrito -->
                    <a class="nav-menu-link-shop px-3 py-2 fw-bold rounded-pill d-flex align-items-center gap-2 text-nowrap"
                        href="#">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>S/ 0.00</span>
                    </a>
                    <!-- Contenedor Dinámico de Usuario / Sesión -->
                    <div id="navUserArea" class="d-flex align-items-center ms-lg-2">
                        <a class="d-flex align-items-center gap-2 text-white text-nowrap" href="login.html">
                            <i class="fa-solid fa-user"></i>
                            <span>Iniciar sesión</span>
                        </a>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main>
        <div class="contenedor-login">
            <div class="login-seccion login-izq w-100 rounded shadow" style="max-width: 650px;">
                <h2 class="login-titulo mb-4">¿AÚN NO TIENES CUENTA? REGÍSTRATE</h2>
                
                <form id="formRegistro">
                    <!-- Información personal -->
                    <div class="beneficios-subtitulo border-bottom pb-2 mb-3">Información personal</div>

                    <div class="row g-3">
                        <div class="col-12 col-md-6 username">
                            <label>Nombre <span>*</span></label>
                            <input type="text" id="regNombre" placeholder="Ej. Camila" required>
                        </div>
                        <div class="col-12 col-md-6 username">
                            <label>Apellidos <span>*</span></label>
                            <input type="text" id="regApellido" placeholder="Ej. Torres" required>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-12 col-md-6 username">
                            <label>Tipo de Documento <span>*</span></label>
                            <select id="regTipoDoc" class="form-select" style="height: 42px; font-size: 14px;" required>
                                <option value="" selected disabled>Por favor seleccione</option>
                                <option value="DNI">DNI</option>
                                <option value="CE">Carnet de Extranjería</option>
                                <option value="PAS">Pasaporte</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-6 username">
                            <label>Número de Documento <span>*</span></label>
                            <input type="text" id="regNumDoc" placeholder="Número de documento" required>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-12 col-md-6 username">
                            <label>Número de teléfono <span>*</span></label>
                            <input type="tel" id="regTelefono" placeholder="999 999 999" required>
                        </div>
                        <div class="col-12 col-md-6 username">
                            <label>Fecha de nacimiento</label>
                            <input type="date" id="regFechaNac">
                        </div>
                    </div>

                    <!-- Información de inicio de sesión -->
                    <div class="beneficios-subtitulo border-bottom pb-2 mb-3 mt-4">Información de inicio de sesión</div>

                    <div class="username">
                        <label>Correo electrónico <span>*</span></label>
                        <input type="email" id="regEmail" placeholder="Ej. nombre@mail.com" required>
                    </div>

                    <div class="row g-3">
                        <div class="col-12 col-md-6 username">
                            <label>Contraseña <span>*</span></label>
                            <div class="input-relative">
                                <input type="password" id="regPassword" placeholder="••••••••" required>
                            </div>
                        </div>
                        <div class="col-12 col-md-6 username">
                            <label>Confirmar contraseña <span>*</span></label>
                            <div class="input-relative">
                                <input type="password" id="regPasswordConfirm" placeholder="••••••••" required>
                            </div>
                        </div>
                    </div>

                    <!-- Términos y condiciones -->
                    <div class="d-flex flex-column gap-2 my-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="checkPromo">
                            <label class="form-check-label text-dark small" for="checkPromo">
                                Acepto recibir <strong>promociones y novedades</strong>.
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="checkTerminos" required>
                            <label class="form-check-label text-dark small" for="checkTerminos">
                                Acepto los <a href="#" class="recordar p-0 d-inline text-decoration-underline">términos y condiciones</a> y la política de privacidad. <span>*</span>
                            </label>
                        </div>
                    </div>

                    <!-- Acciones -->
                    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3 pt-2">
                        <a href="login.html" class="recordar m-0"><i class="fa-solid fa-arrow-left me-1"></i> Ya tengo cuenta</a>
                        <input type="submit" value="CREAR CUENTA" class="btn-login w-auto px-4">
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="py-4 text-center">
        <div class="container">
            <p class="small text-white-50 mb-0">&copy; 2026 La Caleta. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
